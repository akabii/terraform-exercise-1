stages:
  - validate
  - plan

image: hashicorp/terraform:1.9

fmt:
  stage: validate
  script:
    - cd terraform
    - terraform fmt -check -recursive

validate:
  stage: validate
  script:
    - cd terraform
    - terraform init -backend=false
    - terraform validate

plan:
  stage: plan
  variables:
    AWS_ACCESS_KEY_ID: "AKIAEXAMPLEDONOTUSE"
    AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI-EXAMPLE-KEY"
  script:
    - cd terraform
    - terraform init
    - terraform plan
